server:
  port: 8902
  servlet:
    context-path: /easyurl
  compression:
    enabled: true
spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    static-path-pattern: /**
  profiles:
    active: test
  application:
    name: easyurl
  main:
    allow-circular-references: true
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      max-file-size: 10MB
management:
  endpoints:
    enabled-by-default: false

sa-token:
  #前端提交及redis保存的key前缀，同一个redis存在多个服务的token时，确保此项不重复
  token-name: urltoken
  # token有效期，单位s 默认2h, -1代表永不过期
  timeout: 7200
  # 是否允许同一账号并发登录 (为true时允许一起登录, 为false时新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个token (为true时所有登录共用一个token, 为false时每次登录新建一个token)
  is-share: true
  # token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false
  is-read-body: false
  is-read-cookie: false
  is-read-header: true
  is-print: false
ignore:
  url:
    - /base/logon
    - /base/getKeyIv
    - /doc.html
    - /webjars/**
    - /swagger-resources/**
    - /v2/api-docs/**
    - /error
    - /favicon.ico
    - /openApi/**
    - /url/redirect/**
    - /index.html
    - /index.html.gz
    - /assets/**
    - /favicon.svg







