<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #2c3e50;
            margin: 0;
            line-height: 1;
        }

        .error-message {
            font-size: 24px;
            color: #7f8c8d;
            margin: 20px 0;
        }

        .home-button {
            display: inline-block;
            padding: 12px 30px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 25px;
            transition: background-color 0.3s;
        }

        .home-button:hover {
            background-color: #2980b9;
        }

        .astronaut {
            font-size: 100px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="astronaut">👨‍🚀</div>
    <h1 class="error-code">404</h1>
    <p class="error-message">Oops! 页面走丢了~~~</p>
    <p>The page you are looking for might have been removed or is temporarily unavailable.</p>
<!--    <a href="/" class="home-button">Back to Home</a>-->
</div>
</body>
</html>
